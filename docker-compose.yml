services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: opsswarm
      POSTGRES_USER: opsswarm
      POSTGRES_PASSWORD: opsswarm
    ports:
      - "5432:5432"
    volumes:
      - opsswarm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsswarm -d opsswarm"]
      interval: 5s
      timeout: 5s
      retries: 5

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    ports:
      - "8100:8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/telemetry')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  opsswarm-postgres:
