name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opsswarm
          POSTGRES_USER: opsswarm
          POSTGRES_PASSWORD: opsswarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsswarm -d opsswarm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opsswarm:opsswarm@localhost:5432/opsswarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e .
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
